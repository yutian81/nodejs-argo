zerops:
  - setup: nodejsargo
    build:
      base: alpine/nodejs@22
      buildCommands:
        - npm install
      deployFiles:
        - index.js
        - index.html
        - package.json
        - package-lock.json
        - node_modules
      cache:
        - node_modules
      ports:
        - port: 3000
          httpSupport: true
      run:
        base: alpine/nodejs@22
        start: npm start
